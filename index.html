<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>神様アイコン識別ツール｜カオゼロ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Rajdhani:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>⚡ 神様アイコン識別ツール</h1>
  <p>カオスゼロナイトメア｜複数枚一括識別</p>
  <p style="font-size:10px; color:#444444; margin-top:4px;">v3.28</p>
</div>

<!-- STEP 1: 画像選択 -->

<div class="card">
  <div class="card-title">STEP 1 ── 画像を選択（複数可）</div>
  <div class="pattern-toggle">
    <button class="pattern-btn active" id="btnAuto"  onclick="setPattern('auto')">🔄 自動判定<br><span style="font-size:10px;opacity:.7;">16:9→P2 / その他→P1</span></button>
    <button class="pattern-btn"        id="btnP2"    onclick="setPattern('p2')">詳細画面<br><span style="font-size:10px;opacity:.7;">パターン2（固定）</span></button>
    <button class="pattern-btn pattern-btn-small" id="btnP1" onclick="setPattern('p1')">✂ 切り抜き<br><span style="font-size:9px;opacity:.5;">(コスト判別未実装)</span></button>
  </div>
  <div class="upload-btns">
    <label class="upload-btn" style="min-height:80px;">
      <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(event)">
      <span class="upload-btn-icon">🖼️</span>
      <span class="upload-btn-label">写真ライブラリから選択</span>
    </label>
  </div>
  <p class="upload-hint">※ショートカットと同じ順番で選択してね（20枚以下推奨）</p>
</div>

<!-- 常時表示デバッグパネル（STEP2で止まる問題の診断用） -->

<div id="debugPanelGlobal" style="display:none;margin-bottom:8px;padding:10px;background:#1a1a2e;border:1px solid #ff5555;border-radius:8px;font-size:11px;color:#e0e0e0;white-space:pre-wrap;word-break:break-all;"></div>
<button onclick="var p=document.getElementById('debugPanelGlobal'); p.style.display=p.style.display==='none'?'block':'none';"
  style="width:100%;margin-bottom:12px;padding:6px 14px;background:#2a1a1a;border:1px solid #ff5555;border-radius:8px;color:#ff5555;font-size:11px;cursor:pointer;">
  🔍 デバッグ情報（常時表示）
</button>

<!-- STEP 2: 識別結果 -->

<div class="card" id="resultSection">
  <div class="card-title">STEP 2 ── 識別結果（プルダウンで修正可）</div>
  <div class="result-list" id="resultList"></div>
</div>

<!-- STEP 3: コスト確認 -->

<div class="card" id="costSection" style="display:none;">
  <div class="card-title">STEP 3 ── コスト確認</div>
  <div class="cost-list" id="costList"></div>
</div>

<!-- STEP 4: ショートカットテキストと合成 -->

<div class="card" id="mergeSection" style="display:none;">
  <div class="card-title">STEP 4 ── ショートカットテキストと合成</div>

  <!-- カード種別トグル -->

  <div style="display:flex;gap:8px;margin-bottom:10px;">
    <button id="toggleCharBtn" onclick="setCardMode('character')"
      style="flex:1;padding:8px;border-radius:8px;border:2px solid #78DEC1;background:rgba(120,222,193,0.15);color:#78DEC1;font-size:12px;font-weight:700;cursor:pointer;">
      🎭 キャラ版
    </button>
    <button id="toggleSharedBtn" onclick="setCardMode('shared')"
      style="flex:1;padding:8px;border-radius:8px;border:1px solid #444;background:transparent;color:#666;font-size:12px;font-weight:700;cursor:pointer;">
      🃏 共用カード版
    </button>
  </div>

  <label class="upload-btn" style="width:100%; min-height:64px;">
    <input type="file" id="shortcutFile" accept="text/plain,.txt" onchange="loadShortcutFile(event)">
    <span class="upload-btn-icon">📄</span>
    <span class="upload-btn-label">テキストファイルをアップロード</span>
  </label>

  <!-- ローディング表示 -->

  <div id="dataLoadingMsg" style="display:none;margin-top:10px;padding:10px;background:#1e2a1e;border:1px solid #34d399;border-radius:8px;color:#34d399;font-size:12px;text-align:center;">
    ⏳ 照合データ読み込み中... 完了後に自動で照合が始まるよ！
  </div>

  <!-- デバッグパネル -->

  <div id="debugPanel" style="display:none;margin-top:10px;padding:10px;background:#1a1a2e;border:1px solid #e040fb;border-radius:8px;font-size:11px;color:#e0e0e0;white-space:pre-wrap;word-break:break-all;"></div>
  <button onclick="document.getElementById('debugPanel').style.display = document.getElementById('debugPanel').style.display === 'none' ? 'block' : 'none';"
    style="margin-top:8px;padding:6px 14px;background:#2a1a3e;border:1px solid #e040fb;border-radius:8px;color:#e040fb;font-size:11px;cursor:pointer;">
    🔍 デバッグ情報
  </button>

  <div id="shortcutLoaded" style="display:none; margin-top:10px;">
    <div class="item-conf" id="shortcutFileName"></div>
    <div id="confirmTableArea" style="display:none; margin-top:10px;">
      <div class="card-title" style="margin-bottom:4px;">📋 照合・確認（順番・カード・ヒラメキ）</div>
      <div id="confirmCards"></div>
      <button class="btn btn-merge" onclick="mergeData()" style="margin-top:10px;">⚡ 確認OK・合成して出力</button>
    </div>
  </div>
  <div id="mergeResult" style="display:none; margin-top:14px;">
    <div class="card-title" style="margin-bottom:8px;">合成結果</div>
    <div class="copy-preview" id="mergePreview"></div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn btn-copy" id="mergeCopyBtn" onclick="copyMerged()">📋 コピー</button>
      <button class="btn btn-save" onclick="saveMerged()">💾 テキスト保存</button>
    </div>
  </div>
</div>

<div class="card" id="resetSection" style="display:none;">
  <button class="btn btn-reset" onclick="resetTool()">↩ リセットして最初から</button>
</div>

<!-- 拡大モーダル -->

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-inner">
    <canvas id="zoomCanvas"></canvas>
    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script src="cost.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
<script>
  /*
   * グローバルエラーキャッチ
   * JSエラー・未処理のPromiseエラーをデバッグパネルに赤字で表示する。
   * 「処理中のまま止まる」原因を特定するために追加。
   * data.jsのdebugLog()がロードされる前でも動くよう直接DOMを操作する。
   * 更新: 2026-05-20 00:04
   */
  // エラーを両方のデバッグパネルに赤字で出力する
  // debugPanelGlobal: 常時表示（STEP2で止まる問題の診断用）
  // debugPanel: STEP4内（JSON照合確認用）
  // 更新: 2026-05-20 00:04
  function _writeErrorToPanel(msg) {
    ['debugPanelGlobal', 'debugPanel'].forEach(id => {
      const panel = document.getElementById(id);
      if (panel) {
        panel.style.display = 'block';
        panel.innerHTML += `<span style="color:#ff5555">${msg}</span>\n`;
      }
    });
  }
  window.onerror = function(msg, src, line, col, err) {
    _writeErrorToPanel(`❌ JSエラー: ${msg}\n  場所: ${src} ${line}:${col}`);
    console.error('onerror:', msg, src, line, col, err);
  };
  window.addEventListener('unhandledrejection', function(e) {
    _writeErrorToPanel(`❌ 非同期エラー: ${e.reason}`);
    console.error('unhandledrejection:', e.reason);
  });

  /* ============================================================
     定数・データ
  ============================================================ */
  const GODS = {
    ディアロス: ['#F3BA88','#D69D73','#E6AA7D','#E7A171','#D18A60','#FDECCA'],
    セクレド:   ['#78DEC1','#757DD2','#5183A3','#6997BF','#6AD0BF','#F3FE7B','#6B9DD0','#C7F38B'],
    キルケン:   ['#E5B1FA','#FEECE8','#F0C9B6','#CCBFFB','#FBE5CB'],
    ニヒルム:   ['#86CDF4','#7BB1DF','#A3E8FD','#447AA5','#629AC9'],
    ヴィトル:   ['#AB9180','#6A5D63','#927D78','#988792','#836D69'],
    '@?#$':    ['#6020E0','#8040E0','#E0C0E0','#6020C0','#C0A0E0','#A080C0','#A080E0'],
  };
  const GOD_NAMES = Object.keys(GODS);

  const CROP_P2 = { x1:0.403, x2:0.430, y1:0.301, y2:0.353 };
  const CROP_P1 = { x1:0.11,  x2:0.22,  y1:0.22,  y2:0.31  };

  const hexToRgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const GOD_RGB = {};
  for (const [name, hexes] of Object.entries(GODS)) GOD_RGB[name] = hexes.map(hexToRgb);


  /*
   * ── グローバル変数（外部JSファイルから参照される変数）──
   *
   * 【重要】意図的にwindowオブジェクトに公開しているグローバル変数。
   * ui.js・app.jsから直接参照されるため、letやconstで宣言してはいけない。
   * 参照側は window. なしの短縮形（results等）で記述してOK。
   *
   * 【過去の失敗 2026-05-19】
   * ui.js切り出し時にlet宣言のままにしていたため、
   * ui.jsからresultsが参照できずSTEP2が処理中のまま止まるバグが発生。
   * letはscriptタグ内のブロックスコープに閉じるため外部JSから見えない。
   *
   * 新しい変数を追加する場合も必ずwindow.変数名の形で宣言すること。
   * 更新: 2026-05-19 18:59
   */
  window.results       = [];
  window.confirmItems  = []; // { resultIdx, excluded, charName, cardKey, hiramekiNum, kakureEffect, shinEffect, matchScore }
  window.currentBlocks = {}; // parseShortcutTextの結果を保持
  window.patternMode   = 'auto'; // 'auto' | 'p2' | 'p1'
  window.cardMode      = 'character'; // 'character' | 'shared'
  window.dataReady     = false; // JSONロード完了フラグ


</script>


<!-- ヒラメキ選択パネル -->
<div class="hpanel-overlay" id="hpanelOverlay">
  <div class="hpanel-panel">
    <div class="hpanel-head">
      <div class="hpanel-title-row">
        <span class="hpanel-title" id="hpanelTitle">効果を選択</span>
        <button class="hpanel-close" onclick="hpanelClose()">✕</button>
      </div>
      <div class="hpanel-search-wrap">
        <span class="hpanel-search-icon">🔍</span>
        <input class="hpanel-search" id="hpanelSearch" type="text"
          placeholder="効果名で絞り込み…"
          oninput="hpanelSearch(this.value)">
      </div>
    </div>
    <div class="hpanel-body" id="hpanelBody"></div>
  </div>
</div>
</body>
</html>
